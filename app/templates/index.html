<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AI Incident Assistant</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="container">

        <h1>AI Incident Assistant</h1>

        <p>
            Analyze production incidents using AI.
        </p>

        <form method="post">

            <label for="incident-title">
                Incident Title
            </label>

            <input
                id="incident-title"
                name="incident_title"
                type="text"
                value="{{ title }}"
                placeholder="Database timeout after deployment"
            >

            <label for="logs">
                Logs
            </label>

            <textarea
                id="logs"
                name="logs"
                rows="15"
                placeholder="Paste your logs here..."
            >{{ logs }}</textarea>

            <div class="button-container">
                <button type="submit">
                    Analyze
                </button>
            </div>

        </form>

       <div class="result-box">
            <h2>Analysis Result</h2>
            {% if result %}
                <pre>{{ result }}</pre>
            {% else %}
                <p>No analysis yet.</p>
            {% endif %}
        </div>
    </div>
</body>

</html>
